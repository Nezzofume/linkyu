<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linkyu — Batch Image Uploader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="hero">
    <div>
      <span class="eyebrow">LINKYU</span>
      <h1>Batch Image Uploader</h1>
      <p>Upload banyak gambar sekaligus. Hasil link tetap sesuai urutan.</p>
    </div>
    <span class="pill">Uploader siap</span>
  </section>

  <section class="panel grid">
    <label>Jenis link
      <select id="linkType">
        <option value="direct">Direct image URL</option>
        <option value="viewer">Viewer URL</option>
      </select>
    </label>
    <label>Upload bersamaan
      <select id="concurrency">
        <option value="1">1 file</option>
        <option value="2">2 file</option>
        <option value="3" selected>3 file</option>
        <option value="4">4 file</option>
        <option value="5">5 file</option>
      </select>
    </label>
  </section>

  <section class="panel">
    <div id="dropzone" class="dropzone">
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
      <div class="plus">＋</div>
      <h2>Pilih atau drop gambar</h2>
      <p>Bisa upload banyak gambar sekaligus.</p>
      <button id="pickFiles" type="button" class="primary">Pilih Gambar</button>
    </div>
  </section>

  <section class="panel">
    <div class="head">
      <div>
        <h2>Daftar Upload</h2>
        <p id="queueInfo">Belum ada gambar.</p>
      </div>
      <div class="actions">
        <button id="clearAll" type="button">Hapus Semua</button>
        <button id="uploadAll" type="button" class="primary">Upload Semua</button>
      </div>
    </div>
    <div id="queue"></div>
  </section>

  <section class="panel">
    <div class="head">
      <div>
        <h2>Hasil Link</h2>
        <p>Urutan link mengikuti urutan gambar.</p>
      </div>
      <div class="actions">
        <button id="copyAll" type="button">Copy All</button>
        <button id="copyNumbered" type="button">Copy Bernomor</button>
      </div>
    </div>
    <textarea id="resultText" readonly placeholder="Link hasil upload akan muncul di sini..."></textarea>
    <div class="meta">
      <span id="okCount">0 berhasil</span>
      <span id="failCount">0 gagal</span>
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
